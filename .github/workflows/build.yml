name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Theos
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          git -C "$HOME/theos" submodule update --init --recursive
          git clone --depth 1 https://github.com/theos/toolchain.git "$HOME/theos/toolchain"
          git clone --depth 1 https://github.com/theos/sdks.git "$HOME/theos/sdks"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: ellekit
        continue-on-error: true
        run: |
          mkdir -p vendor
          url=$(curl -s https://api.github.com/repos/elevatedperms/ellekit/releases/latest | grep -o 'https://[^"]*\.deb' | head -1)
          if [ -z "$url" ]; then
            f=$(curl -sL https://ellekit.space/Packages.bz2 | bzip2 -d | awk '/^Filename:/{print $2; exit}')
            url="https://ellekit.space/${f#./}"
          fi
          curl -sL "$url" -o /tmp/ek.deb
          dpkg-deb -x /tmp/ek.deb /tmp/ek
          find /tmp/ek -name 'libellekit.dylib' -exec cp {} vendor/ \;
      - name: Build
        run: make FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: MCHeat
          path: |
            .theos/obj/arm64/MCHeat.dylib
            vendor/libellekit.dylib
