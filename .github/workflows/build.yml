name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Theos
        run: |
          set -eu
          cd "$HOME"
          dl() {
            for b in main master; do
              if curl -fsSL "https://codeload.github.com/$1/tar.gz/refs/heads/$b" -o /tmp/t.tgz && tar tzf /tmp/t.tgz >/dev/null 2>&1; then
                echo "$b"; return 0
              fi
            done
            return 1
          }
          b=$(dl theos/theos); tar xzf /tmp/t.tgz -C "$HOME"; mv "$HOME/theos-$b" "$HOME/theos"
          b=$(dl theos/sdks);  tar xzf /tmp/t.tgz -C "$HOME/theos"; mv "$HOME/theos/sdks-$b" "$HOME/theos/sdks"
          mkdir -p "$HOME/theos/vendor" /tmp/x
          grab() {
            for b in main master; do
              if curl -fsSL "https://codeload.github.com/theos/$1/tar.gz/refs/heads/$b" -o /tmp/t.tgz && tar tzf /tmp/t.tgz >/dev/null 2>&1; then
                tar xzf /tmp/t.tgz -C /tmp/x
                rm -rf "$HOME/theos/vendor/$2"
                mv "/tmp/x/$1-$b" "$HOME/theos/vendor/$2"
                return 0
              fi
            done
            echo "FAIL: $1"; return 1
          }
          grab headers include
          grab lib lib
          grab logos logos
          grab dm.pl dm.pl
          grab nic nic
          grab templates templates
          grab orion orion
          mkdir -p "$HOME/theos/vendor/include/.git" "$HOME/theos/vendor/lib/.git"
          ls -la "$HOME/theos/vendor"
          test -d "$HOME/theos/vendor/include"
          test -d "$HOME/theos/vendor/lib"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: ellekit
        continue-on-error: true
        run: |
          set -eu
          mkdir -p vendor
          url=$(curl -s https://api.github.com/repos/elevatedperms/ellekit/releases/latest | grep -o 'https://[^"]*\.deb' | head -1)
          if [ -z "$url" ]; then
            f=$(curl -sL https://ellekit.space/Packages.bz2 | bzip2 -d | awk '/^Filename:/{print $2; exit}')
            url="https://ellekit.space/${f#./}"
          fi
          curl -sL "$url" -o /tmp/ek.deb
          mkdir -p /tmp/ek && cd /tmp/ek
          ar x /tmp/ek.deb
          d=$(ls data.tar.* | head -1)
          case "$d" in
            *.gz)  tar xzf "$d" ;;
            *.xz)  tar xJf "$d" ;;
            *.zst) brew install zstd >/dev/null 2>&1; tar --zstd -xf "$d" ;;
          esac
          find . -name 'libellekit.dylib' -exec cp {} "$GITHUB_WORKSPACE/vendor/" \;
          ls -l "$GITHUB_WORKSPACE/vendor"
      - name: Build
        run: make FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: MCHeat
          path: |
            .theos/obj/arm64/MCHeat.dylib
            vendor/libellekit.dylib
